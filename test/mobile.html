<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MiriTranslator — mobile viewport test</title>
<style>
  body { margin: 0; background: #202124; font: 13px system-ui, sans-serif; color: #ddd; display: flex; gap: 16px; padding: 16px; }
  figure { margin: 0; }
  figcaption { padding: 6px 2px; }
  iframe { border: 0; border-radius: 12px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
</style>
</head>
<body>
  <figure>
    <figcaption>390 × 844 (iPhone 14)</figcaption>
    <iframe src="./harness.html" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>320 × 568 (small phone)</figcaption>
    <iframe src="./harness.html" width="320" height="568"></iframe>
  </figure>
</body>
</html>
